<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Random Number Generator</title>
<style>
  :root {
    --bg: #eef2f7;
    --panel: #ffffff;
    --ink: #14213d;
    --muted: #5b6b85;
    --line: #c9d3e3;
    --accent: #1f4fd8;
    --accent-ink: #ffffff;
    --result-bg: #14213d;
    --result-ink: #f5f8ff;
    --error: #b42318;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1524;
      --panel: #172036;
      --ink: #e8eefc;
      --muted: #9aaacb;
      --line: #2c3a58;
      --accent: #6b93ff;
      --accent-ink: #0e1524;
      --result-bg: #060b16;
      --result-ink: #f5f8ff;
      --error: #ff8a80;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    display: grid;
    place-items: center;
    padding: 1.25rem;
  }
  main {
    width: 100%;
    max-width: 26rem;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 1.5rem;
  }
  h1 { font-size: 1.4rem; margin: 0 0 1.25rem; letter-spacing: -0.01em; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
  label { display: block; font-size: 0.9rem; color: var(--muted); margin-bottom: 0.3rem; }
  input[type="number"] {
    width: 100%;
    font: inherit;
    font-size: 1.05rem;
    padding: 0.6rem 0.7rem;
    color: var(--ink);
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 8px;
  }
  fieldset { border: 0; padding: 0; margin: 1.1rem 0 0; }
  legend { font-size: 0.9rem; color: var(--muted); padding: 0; margin-bottom: 0.4rem; }
  .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; }
  .choices label {
    margin: 0;
    display: flex; align-items: center; gap: 0.5rem;
    padding: 0.6rem 0.7rem;
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 8px;
    cursor: pointer;
  }
  .choices label:has(input:checked) { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .places { margin-top: 0.75rem; }
  .places[hidden] { display: none; }
  button {
    width: 100%;
    margin-top: 1.25rem;
    font: inherit;
    font-weight: 600;
    font-size: 1.05rem;
    padding: 0.8rem;
    color: var(--accent-ink);
    background: var(--accent);
    border: 0;
    border-radius: 8px;
    cursor: pointer;
  }
  button:active { transform: translateY(1px); }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  #result {
    margin-top: 1.25rem;
    min-height: 5.5rem;
    display: grid;
    place-items: center;
    padding: 1rem;
    background: var(--result-bg);
    color: var(--result-ink);
    border-radius: 10px;
    font-size: clamp(1.8rem, 9vw, 2.6rem);
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    word-break: break-all;
    text-align: center;
  }
  #result.empty { font-size: 1rem; font-weight: 400; color: #9aaacb; }
  #error { color: var(--error); font-size: 0.9rem; min-height: 1.2rem; margin: 0.6rem 0 0; }
</style>
</head>
<body>
<main>
  <h1>Random Number Generator</h1>

  <div class="row">
    <div>
      <label for="lower">Lower limit</label>
      <input type="number" id="lower" value="1" step="any">
    </div>
    <div>
      <label for="upper">Upper limit</label>
      <input type="number" id="upper" value="100" step="any">
    </div>
  </div>

  <fieldset>
    <legend>Number type</legend>
    <div class="choices">
      <label><input type="radio" name="type" value="integer" checked> Integer</label>
      <label><input type="radio" name="type" value="decimal"> With decimal</label>
    </div>
    <div class="places" id="placesWrap" hidden>
      <label for="places">Decimal places</label>
      <input type="number" id="places" value="2" min="1" max="10" step="1">
    </div>
  </fieldset>

  <button type="button" id="generate">Generate</button>
  <p id="error" role="alert"></p>
  <div id="result" class="empty" aria-live="polite">Press Generate</div>
</main>

<script>
  const lowerEl = document.getElementById('lower');
  const upperEl = document.getElementById('upper');
  const placesEl = document.getElementById('places');
  const placesWrap = document.getElementById('placesWrap');
  const resultEl = document.getElementById('result');
  const errorEl = document.getElementById('error');
  const typeEls = document.querySelectorAll('input[name="type"]');

  const getType = () => document.querySelector('input[name="type"]:checked').value;

  typeEls.forEach(el => el.addEventListener('change', () => {
    placesWrap.hidden = getType() !== 'decimal';
  }));

  function secureRandom() {
    // Uniform float in [0, 1) using the browser's crypto source
    const buf = new Uint32Array(2);
    crypto.getRandomValues(buf);
    return (buf[0] * 2097152 + (buf[1] >>> 11)) / 9007199254740992;
  }

  function generate() {
    errorEl.textContent = '';
    const lo = parseFloat(lowerEl.value);
    const hi = parseFloat(upperEl.value);

    if (Number.isNaN(lo) || Number.isNaN(hi)) {
      errorEl.textContent = 'Enter both a lower and an upper limit.';
      return;
    }
    if (lo > hi) {
      errorEl.textContent = 'The lower limit must not be greater than the upper limit.';
      return;
    }

    let value;
    if (getType() === 'integer') {
      const min = Math.ceil(lo), max = Math.floor(hi);
      if (min > max) {
        errorEl.textContent = 'There is no whole number between those limits.';
        return;
      }
      value = Math.floor(secureRandom() * (max - min + 1)) + min;
    } else {
      const places = Math.min(10, Math.max(1, parseInt(placesEl.value, 10) || 2));
      value = (secureRandom() * (hi - lo) + lo).toFixed(places);
    }

    resultEl.classList.remove('empty');
    resultEl.textContent = value;
  }

  document.getElementById('generate').addEventListener('click', generate);
  [lowerEl, upperEl, placesEl].forEach(el =>
    el.addEventListener('keydown', e => { if (e.key === 'Enter') generate(); })
  );
</script>
</body>
</html>
